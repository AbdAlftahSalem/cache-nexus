name: cache_nexus
description: Offline-first caching for Flutter. Memory + Hive tiers, TTL, 5 cache policies, typed adapters, AES-GCM encryption, per-user isolation, reactive streams and offline sync.
version: 1.1.0
homepage: https://github.com/AbdAlftahSalem/cache-nexus
issue_tracker: https://github.com/AbdAlftahSalem/cache-nexus/issues
documentation: https://github.com/AbdAlftahSalem/cache-nexus/tree/main/doc
repository: https://github.com/AbdAlftahSalem/cache-nexus
topics:
  - cache
  - offline
  - hive
  - flutter
  - dio

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  archive: ^4.0.0
  connectivity_plus: ^7.1.1
  crypto: ^3.0.3
  dio: ^5.4.0
  flutter:
    sdk: flutter
  hive_ce: ^2.19.0
  hive_ce_flutter: ^2.3.0
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  test: ^1.25.6
